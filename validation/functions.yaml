# Validation tests for VR-schema functions

# Recompute expected values independently of the implementations under test.
# For models.yaml, follow the target schema and
# docs/source/conventions/computed_identifiers.rst. Use the VRS 1.3 rules for
# `ga4gh_1_3_*` entries.
#
# For `sha512t24u`, hash `in.blob` as UTF-8 with SHA-512 and encode the first
# 24 bytes of the digest as unpadded base64url.
# Run `make -C validation -B` from the repository root to refresh both JSON files.

# top-level keys are function names
# in subkey contains key-value pairs of constructor arguments
# out subkey contains output of function on "in" arguments

sha512t24u:
  -
    in:
      blob: ""
    out: "z4PhNX7vuL3xVChQ1m2AB9Yg5AULVxXc"
  -
    in:
      blob: "ACGT"
    out: "aKF498dAxcJAqme6QYQ7EZ07-fiw8Kw2"
