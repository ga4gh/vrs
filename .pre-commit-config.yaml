repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [ --fix=lf ]
  - repo: local
    hooks:
      - id: update-json-def-files
        name: Update json and def files
        entry: pre-commit-hooks/update-json-def-files.sh
        language: system
        files: ^schema/.*/.*-source.yaml$
        require_serial: true
      - id: update-example-files
        name: Update json and README example files
        entry: pre-commit-hooks/update-examples.sh
        language: system
        files: ^examples/.*\.yaml$
        require_serial: true
      - id: update-validation-files
        name: Update json validation files
        entry: pre-commit-hooks/update-validation.sh
        language: system
        files: ^validation/.*\.yaml$
        require_serial: true
